<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Grocery Management System</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Smart Grocery Management System</h1><p>Manage products, stock and sales easily</p></header>
<main>
<section class="card">
<h2>Add Grocery Product</h2>
<form id="productForm">
<input id="name" placeholder="Product Name" required>
<select id="category" required><option value="">Category</option><option>Fruits</option><option>Vegetables</option><option>Dairy</option><option>Bakery</option><option>Groceries</option><option>Beverages</option></select>
<input id="price" type="number" min="0" step="0.01" placeholder="Price" required>
<input id="stock" type="number" min="0" placeholder="Stock Quantity" required>
<button type="submit">Add Product</button>
</form>
</section>
<section class="card"><h2>Product Inventory</h2><input id="search" placeholder="Search products..." oninput="render()"><div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Action</th></tr></thead><tbody id="productList"></tbody></table></div></section>
<section class="stats"><div><b id="productCount">0</b><span>Products</span></div><div><b id="stockCount">0</b><span>Total Stock</span></div><div><b id="lowStock">0</b><span>Low Stock</span></div></section>
</main>
<footer>Smart Grocery Management System | Mini Project</footer>
<script src="js/script.js"></script>
</body></html>
